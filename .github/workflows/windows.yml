# Builds TuffCode for Windows on GitHub's Windows machines and tests the built app the way it ships:
# the Tuff tools inside it (MCP server, checker, runtime), the IDE opening, and the IDE end-to-end
# suites with stand-in agents (test/e2e). Runs on pull requests, or by hand (Actions → Windows build → Run workflow).
name: Windows build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows (x64)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: tuffcode
        shell: bash
    env:
      APP: ../build/installer/win-unpacked/TuffCode.exe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tuffcode/package-lock.json

      - name: Install PyInstaller
        run: python -m pip install pyinstaller certifi pywebview

      # npm run build:runtime, but with the Python set up above: py -3 could pick another one.
      - name: Build the Tuff runtime
        run: python -m PyInstaller --noconfirm --clean --onedir --console --name tuff-runtime --paths .. --hidden-import tuff_tgui --hidden-import tuff_tap --hidden-import ssl --hidden-import certifi --hidden-import tuff_view --add-data ../tuff_view_web:tuff_view_web --hidden-import tuff_tgame --distpath ../build/runtime --workpath ../build/work --specpath ../build ../tuff.py

      - run: npm ci

      - name: Build TuffCode (the unpacked app, no installer)
        run: npx electron-builder --win --dir --x64 --publish never

      - name: Test the Tuff tools inside the app (MCP server, checker, runtime)
        run: node test/mcp-test.mjs "$APP" ../build/installer/win-unpacked/resources/app.asar.unpacked/mcp/tuff-mcp.js

      - name: Open the app and check the IDE
        run: node test/app-smoke.mjs "$APP" ../build/installer/screenshot-win.png

      - name: Drive the app through the e2e suites (stand-in agents)
        run: node test/e2e/run.mjs --app "$APP"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-test-output
          path: |
            build/installer/screenshot-*.png
            tuffcode/test/e2e/out/
          if-no-files-found: warn
