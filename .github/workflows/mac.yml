# Builds TuffCode for Mac (Apple Silicon and Intel) on GitHub's Mac machines, tests the built app,
# and adds the Mac downloads to a release: when one is published, or when it's run by hand with a
# release tag (Actions → Mac build → Run workflow, or: gh workflow run mac.yml -f tag=v1.0.2).
name: Mac build

on:
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release to build and add the Mac files to, like v1.0.2. Leave empty to only build and test.'
        required: false
        default: ''
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Mac (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        working-directory: tuffcode
    steps:
      - uses: actions/checkout@v4
        with:
          # A release's own code, so its Mac files match its Windows installer.
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tuffcode/package-lock.json

      - name: Check Python has tkinter (Tuff's window library needs it)
        run: python3 -c "import tkinter; print('Tk', tkinter.TkVersion)"

      - name: Install PyInstaller
        run: python3 -m pip install pyinstaller certifi

      - name: Build the Tuff runtime
        run: npm run build:runtime:mac

      - name: Run a Tuff program with the runtime
        run: |
          printf 'say "hi from a Mac"\nfor i in range(1, 3):\n    say i\n' > /tmp/hello.tuf
          ../build/runtime/tuff-runtime/tuff-runtime /tmp/hello.tuf | tee /tmp/out.txt
          grep -q "hi from a Mac" /tmp/out.txt

      - run: npm ci

      - name: Build TuffCode.app, the .dmg and the .zip
        # Sign (ad-hoc) on pull requests too, so a PR tests exactly what a release ships.
        env:
          CSC_FOR_PULL_REQUEST: 'true'
        run: npx electron-builder --mac dmg zip --${{ matrix.arch }} --publish never

      # Test the app the way people get it: copied out of the .dmg.
      - name: Take TuffCode.app out of the .dmg
        run: |
          DMG="$(ls ../build/installer/*.dmg | head -1)"
          MNT="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$MNT" "$DMG"
          ditto "$MNT/TuffCode.app" "$RUNNER_TEMP/TuffCode.app"
          hdiutil detach "$MNT"
          echo "APP=$RUNNER_TEMP/TuffCode.app" >> "$GITHUB_ENV"

      # A broken signature makes macOS call a downloaded app "damaged" with no way to open it.
      # A valid ad-hoc one gets "Open Anyway" in Privacy & Security instead.
      - name: Check the app's signature
        run: |
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv "$APP" 2>&1 | grep -E "Identifier|Signature|Format"
          codesign --verify --strict --verbose=2 "$APP/Contents/Resources/runtime/tuff-runtime"
          spctl --assess --type execute -vv "$APP" || echo "Gatekeeper: not notarized (expected without an Apple Developer ID)"

      - name: Test the Tuff tools inside the app (MCP server, checker, runtime)
        run: node test/mcp-test.mjs "$APP/Contents/MacOS/TuffCode" "$APP/Contents/Resources/app.asar.unpacked/mcp/tuff-mcp.js"

      - name: Open the app and check the IDE
        run: node test/app-smoke.mjs "$APP/Contents/MacOS/TuffCode" "../build/installer/screenshot-${{ matrix.arch }}.png"

      # Skips the suites that only run on Windows (they say why); output goes to tuffcode/test/e2e/out.
      - name: Drive the app through the e2e suites that work on a Mac (stand-in agents)
        run: node test/e2e/run.mjs --app "$APP/Contents/MacOS/TuffCode"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-${{ matrix.arch }}
          path: |
            build/installer/*.dmg
            build/installer/*.zip
            build/installer/*.blockmap
            build/installer/latest-mac.yml
            build/installer/screenshot-*.png
          if-no-files-found: warn

  release:
    name: Add the Mac downloads to the release
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      # Each build writes its own latest-mac.yml. The app's update check reads one file listing
      # both, and picks the arm64 or x64 download by its name.
      - name: Merge latest-mac.yml
        run: |
          node -e '
            const fs = require("fs");
            const read = (a) => fs.readFileSync(`dist/mac-${a}/latest-mac.yml`, "utf8").split("\n");
            const files = (lines) => { const i = lines.indexOf("files:"); let j = i + 1; while (j < lines.length && /^\s/.test(lines[j])) j++; return [i, j]; };
            const arm = read("arm64"), x64 = read("x64");
            const [, armEnd] = files(arm); const [xs, xe] = files(x64);
            arm.splice(armEnd, 0, ...x64.slice(xs + 1, xe));
            fs.writeFileSync("dist/latest-mac.yml", arm.join("\n"));
            console.log(arm.join("\n"));
          '

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name || inputs.tag }}" \
            dist/mac-*/*.dmg dist/mac-*/*.zip dist/mac-*/*.blockmap dist/latest-mac.yml \
            --clobber --repo "${{ github.repository }}"
